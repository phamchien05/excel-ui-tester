<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Đăng nhập - Shop thử nghiệm</title><script src="common.js"></script></head>
<body>
  <!-- Tài khoản đúng: demo / demo123 -->
  <h1>Đăng nhập Shop</h1>
  <form id="login-form">
    <label for="username">Tên đăng nhập</label><input id="username" name="username">
    <label for="password">Mật khẩu</label><input id="password" name="password" type="password">
    <button type="submit">Đăng nhập</button>
  </form>
  <div id="login-error" class="error" style="display:none"></div>
  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var u = document.getElementById('username').value, p = document.getElementById('password').value;
      if (u === 'demo' && p === 'demo123') {
        localStorage.setItem('shop_user', u);
        location.href = 'index.html';
      } else {
        var err = document.getElementById('login-error');
        err.textContent = 'Sai thông tin đăng nhập';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
